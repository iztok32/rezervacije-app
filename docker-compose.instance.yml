# Ena instanca na stranko (npr. konjeniški klub, frizerski salon, glamping).
# Zažene jo deploy.sh:
#   COMPOSE_PROJECT_NAME=<ime> docker compose -f docker-compose.instance.yml \
#     --env-file instances/<ime>.env up -d
# Imena volumnov in omrežij dobijo predpono COMPOSE_PROJECT_NAME, zato so instance ločene.
# TLS zagotavlja obstoječi Traefik (omrežje proxy-network).

services:
  app:
    image: rezervacije:latest
    container_name: ${INSTANCE}-app
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy-network"
      - "traefik.http.routers.${INSTANCE}.rule=Host(`${APP_DOMAIN}`)"
      - "traefik.http.routers.${INSTANCE}.entrypoints=websecure"
      - "traefik.http.routers.${INSTANCE}.tls=true"
      - "traefik.http.routers.${INSTANCE}-http.rule=Host(`${APP_DOMAIN}`)"
      - "traefik.http.routers.${INSTANCE}-http.entrypoints=web"
      - "traefik.http.routers.${INSTANCE}-http.middlewares=${INSTANCE}-redirect"
      - "traefik.http.middlewares.${INSTANCE}-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.${INSTANCE}-redirect.redirectscheme.permanent=true"
      - "traefik.http.services.${INSTANCE}.loadbalancer.server.port=80"
    environment:
      APP_NAME: ${APP_NAME:-Rezervacije}
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      APP_DEBUG: "false"
      APP_URL: ${APP_URL}
      SESSION_SECURE_COOKIE: "true"
      APP_LOCALE: ${APP_LOCALE:-sl}
      APP_FALLBACK_LOCALE: en
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Ljubljana}
      AVAILABLE_LOCALES: ${AVAILABLE_LOCALES:-sl,en}
      LOG_CHANNEL: stderr
      LOG_LEVEL: warning
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      MAIL_MAILER: ${MAIL_MAILER:-smtp}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-tls}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-noreply@example.com}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Rezervacije}
      TRUSTED_PROXIES: "*"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - storage_uploads:/var/www/html/storage/app/public
      - storage_logs:/var/www/html/storage/logs
    restart: always
    networks:
      - internal
      - proxy-network

  postgres:
    image: postgres:17-alpine
    container_name: ${INSTANCE}-postgres
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - internal

volumes:
  postgres_data:
  storage_uploads:
  storage_logs:

networks:
  internal:
    driver: bridge
  proxy-network:
    external: true
